name: Deploy to Baota Panel

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  # Directus Flow calls GitHub's repository dispatch API after content changes.
  repository_dispatch:
    types: [cms-publish, memos-sync]

concurrency:
  group: firefly-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DIRECTUS_PUBLIC_URL: ${{ secrets.DIRECTUS_URL }}
      DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
      MEMOS_ACCESS_TOKEN: ${{ secrets.MEMOS_ACCESS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull published posts from Directus over SSH
        if: ${{ env.DIRECTUS_PUBLIC_URL != '' }}
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USERNAME }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_KEY }}
          DIRECTUS_URL: http://127.0.0.1:18055
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/firefly-deploy
          chmod 600 ~/.ssh/firefly-deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/firefly-deploy \
            -p "$SSH_PORT" \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -NT \
            -L 18055:127.0.0.1:8055 \
            "$SSH_USER@$SSH_HOST" &
          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true; rm -f ~/.ssh/firefly-deploy' EXIT

          for attempt in {1..10}; do
            if curl --silent --output /dev/null --max-time 2 "$DIRECTUS_URL/server/health"; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "Directus SSH tunnel did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          pnpm cms:sync

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.HEATMAP_GITHUB_TOKEN }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USERNAME }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_KEY }}
          MEMOS_API_URL: http://127.0.0.1:15230
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/firefly-deploy
          chmod 600 ~/.ssh/firefly-deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/firefly-deploy \
            -p "$SSH_PORT" \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -NT \
            -L 15230:127.0.0.1:5230 \
            "$SSH_USER@$SSH_HOST" &
          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true; rm -f ~/.ssh/firefly-deploy' EXIT

          for attempt in {1..10}; do
            if curl --silent --output /dev/null --max-time 2 "$MEMOS_API_URL/"; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "Memos SSH tunnel did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          pnpm build:site

      - name: Deploy changed files to Baota Panel
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USERNAME }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_KEY }}
          DEPLOY_TARGET: /www/wwwroot/winered-0v0.com
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/firefly-deploy
          chmod 600 ~/.ssh/firefly-deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/firefly-deploy' EXIT

          ssh \
            -i ~/.ssh/firefly-deploy \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "if ! command -v rsync >/dev/null; then echo 'rsync is required on the server' >&2; exit 1; fi; mkdir -p '$DEPLOY_TARGET'"

          rsync \
            --archive \
            --compress \
            --checksum \
            --delete-delay \
            --delay-updates \
            --human-readable \
            --itemize-changes \
            --exclude='.user.ini' \
            --exclude='.well-known/' \
            -e "ssh -i ~/.ssh/firefly-deploy -p $SSH_PORT" \
            dist/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_TARGET/"
