name: Deploy Firefly to 1Panel

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Directus Flow calls GitHub's repository dispatch API after content changes.
  repository_dispatch:
    types: [cms-publish, memos-sync]

permissions:
  contents: read

concurrency:
  group: firefly-production
  # Let an active rsync finish; a newer deployment waits and runs afterwards.
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.14.4 --activate
          pnpm install --frozen-lockfile

      - name: Sync Bangumi data and covers
        run: pnpm bangumi:sync

      - name: Pull published posts from Directus
        env:
          DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
          DIRECTUS_PUBLIC_URL: ${{ secrets.DIRECTUS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
        run: |
          for variable in DIRECTUS_URL DIRECTUS_TOKEN; do
            if [ -z "${!variable}" ]; then
              echo "Missing $variable GitHub Actions secret" >&2
              exit 1
            fi
          done

          DIRECTUS_URL="${DIRECTUS_URL%/}"
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-all-errors \
            "$DIRECTUS_URL/server/ping"
          pnpm cms:sync

      - name: Verify Memos API
        env:
          MEMOS_API_URL: https://memos.winered-0v0.com
          MEMOS_ACCESS_TOKEN: ${{ secrets.MEMOS_ACCESS_TOKEN }}
        run: |
          if [ -z "$MEMOS_ACCESS_TOKEN" ]; then
            echo "Missing MEMOS_ACCESS_TOKEN GitHub Actions secret" >&2
            exit 1
          fi

          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-all-errors \
            --get \
            --header "Authorization: Bearer $MEMOS_ACCESS_TOKEN" \
            --data-urlencode 'pageSize=1' \
            --data-urlencode 'filter=visibility == "PUBLIC"' \
            "$MEMOS_API_URL/api/v1/memos"

      - name: Build and validate site
        env:
          GITHUB_TOKEN: ${{ secrets.HEATMAP_GITHUB_TOKEN }}
          MEMOS_API_URL: https://memos.winered-0v0.com
          MEMOS_ACCESS_TOKEN: ${{ secrets.MEMOS_ACCESS_TOKEN }}
        run: |
          pnpm build:site
          test -s dist/index.html
          test -s dist/api/dynamic.json

          if grep --recursive --fixed-strings --quiet -- "$MEMOS_ACCESS_TOKEN" dist; then
            echo "Build output contains MEMOS_ACCESS_TOKEN" >&2
            exit 1
          fi
          if [ -n "${GITHUB_TOKEN:-}" ] && \
            grep --recursive --fixed-strings --quiet -- "$GITHUB_TOKEN" dist; then
            echo "Build output contains HEATMAP_GITHUB_TOKEN" >&2
            exit 1
          fi

      - name: Deploy static site to 1Panel
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
          DEPLOY_TARGET: /opt/1panel/www/sites/winered.com/index
        run: |
          for variable in SERVER_HOST SERVER_USERNAME SERVER_PORT SERVER_KEY SERVER_HOST_KEY; do
            if [ -z "${!variable}" ]; then
              echo "Missing $variable GitHub Actions secret" >&2
              exit 1
            fi
          done
          if ! [[ "$SERVER_PORT" =~ ^[0-9]+$ ]] || \
            (( 10#$SERVER_PORT < 1 || 10#$SERVER_PORT > 65535 )); then
            echo "SERVER_PORT is invalid" >&2
            exit 1
          fi
          if [[ "$SERVER_HOST_KEY" != ssh-ed25519\ * ]]; then
            echo "SERVER_HOST_KEY must contain the server's ssh-ed25519 public key" >&2
            exit 1
          fi

          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_KEY" | tr -d '\r' > ~/.ssh/firefly-deploy

          known_host="$SERVER_HOST"
          if [ "$SERVER_PORT" != "22" ]; then
            known_host="[$SERVER_HOST]:$SERVER_PORT"
          fi
          printf '%s %s\n' "$known_host" "$SERVER_HOST_KEY" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/firefly-deploy ~/.ssh/known_hosts' EXIT

          ssh_options=(
            -i ~/.ssh/firefly-deploy
            -p "$SERVER_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o ServerAliveCountMax=3
            -o ServerAliveInterval=15
            -o StrictHostKeyChecking=yes
          )
          rsync_ssh="ssh -i $HOME/.ssh/firefly-deploy -p $SERVER_PORT -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o ServerAliveCountMax=3 -o ServerAliveInterval=15 -o StrictHostKeyChecking=yes"

          ssh "${ssh_options[@]}" "$SERVER_USERNAME@$SERVER_HOST" \
            "command -v rsync >/dev/null || { echo 'rsync is required on the server' >&2; exit 1; }; test -d '$DEPLOY_TARGET' || { echo '1Panel site directory does not exist: $DEPLOY_TARGET' >&2; exit 1; }; test -w '$DEPLOY_TARGET' || { echo '1Panel site directory is not writable: $DEPLOY_TARGET' >&2; exit 1; }"

          rsync \
            --archive \
            --checksum \
            --compress \
            --delay-updates \
            --delete-delay \
            --human-readable \
            --itemize-changes \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            --exclude='.user.ini' \
            --exclude='.well-known/' \
            -e "$rsync_ssh" \
            dist/ \
            "$SERVER_USERNAME@$SERVER_HOST:$DEPLOY_TARGET/"

          ssh "${ssh_options[@]}" "$SERVER_USERNAME@$SERVER_HOST" \
            "test -s '$DEPLOY_TARGET/index.html' && test -s '$DEPLOY_TARGET/api/dynamic.json'"
